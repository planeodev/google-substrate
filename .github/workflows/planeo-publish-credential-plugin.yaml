# FORK-ONLY (planeodev/google-substrate) — NOT part of the upstream contribution.
#
# Publishes cmd/dockerconfig-credential-provider exactly as upstream builds images (ko, distroless, linux/amd64 +
# linux/arm64) to ghcr.io/planeodev/google-substrate/dockerconfig-credential-provider:<branch>-<sha7>, and writes the
# digest to the run summary — the digest planeo-infra pins for atelet's init container until upstream publishes the
# image with its release (it is registered in images.Components, which ate-setup publish iterates).
# The image holds no secret; it is public with this public fork.
name: planeo-publish-credential-plugin

on:
  push:
    branches: ['feature/**']
    paths:
      - cmd/dockerconfig-credential-provider/**
      - .github/workflows/planeo-publish-credential-plugin.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
    - name: Setup Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: 'go.mod'
        cache: false
    - name: Unit tests
      run: go test ./cmd/dockerconfig-credential-provider/
    - name: Build and push with ko
      env:
        KO_DOCKER_REPO: ghcr.io/${{ github.repository }}
        REGISTRY_USER: ${{ github.actor }}
        REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        tag="$(printf '%s' "${GITHUB_REF_NAME}" | tr '/' '-')-${GITHUB_SHA::7}"
        printf '%s' "${REGISTRY_TOKEN}" | KO_CONFIG_PATH="${PWD}" hack/run-tool.sh ko login ghcr.io --username "${REGISTRY_USER}" --password-stdin
        ref="$(KO_CONFIG_PATH="${PWD}" hack/run-tool.sh ko build --bare=false --base-import-paths \
          --platform=linux/amd64,linux/arm64 --tags "${tag}" ./cmd/dockerconfig-credential-provider)"
        echo "ref=${ref}"
        {
          echo "### dockerconfig-credential-provider"
          echo
          echo "- digest-pinned: \`${ref}\`"
          echo "- tag: \`${KO_DOCKER_REPO}/dockerconfig-credential-provider:${tag}\`"
        } >> "${GITHUB_STEP_SUMMARY}"
